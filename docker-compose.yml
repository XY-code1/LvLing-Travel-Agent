services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: scenic_ai_guide
      MYSQL_USER: ${DB_USERNAME:-lvling}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
      - ./database/migration/phase3_city_context.sql:/docker-entrypoint-initdb.d/03-phase3_city_context.sql:ro
      - ./database/migration/sos_request.sql:/docker-entrypoint-initdb.d/04-sos_request.sql:ro
      - ./database/avatar_canvas_migration.sql:/docker-entrypoint-initdb.d/05-avatar_canvas_migration.sql:ro
      - ./database/avatar_selection_migration.sql:/docker-entrypoint-initdb.d/06-avatar_selection_migration.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_URL: jdbc:mysql://mysql:3306/scenic_ai_guide?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-lvling}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      AMAP_WEB_SERVICE_KEY: ${AMAP_WEB_SERVICE_KEY:?AMAP_WEB_SERVICE_KEY is required}
      AI_CONFIG_AES_KEY: ${AI_CONFIG_AES_KEY:?AI_CONFIG_AES_KEY is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://example.com}
      KNIFE4J_ENABLE: "false"
      DEMO_SWITCH_ENABLED: "false"
      LOGGING_LEVEL_COM_GUIDO_SCENICAI: INFO
      MYBATISPLUS_CONFIGURATION_LOGIMPL: org.apache.ibatis.logging.nologging.NoLoggingImpl
    volumes:
      - uploads:/data/scenic-ai/uploads
      - logs:/data/scenic-ai/logs
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tourist-app/unpackage/dist/build/h5:/var/www/lvling:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

volumes:
  mysql-data:
  uploads:
  logs:
